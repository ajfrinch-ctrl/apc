name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-icons.test.mjs compares portal controls with this approved historical checkpoint.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Firebase JS SDK 13 and rules-unit-testing 6 require Node >=24.12.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:firebase && git diff --exit-code -- vendor/firebase/
      - name: Run npm test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/apc-test.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            node tools/ci-test-annotations.mjs "$RUNNER_TEMP/apc-test.log"
          fi
          exit "$test_status"
